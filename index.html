<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RandomPicBot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 35px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    .login-button,
    #postButton {
      border: 0;
      cursor: pointer;
      display: inline-block;
      margin: 10px;
      padding: 14px 25px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }

    .login-button {
      background: #000;
      color: white;
      text-decoration: none;
    }

    #postButton {
      background: #ff0050;
      color: white;
      display: none;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      margin: 0 10px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RandomPicBot</h1>

  <p>
    Automatically find beautiful photos and post them to TikTok.
  </p>

  <a
    id="loginButton"
    class="login-button"
    href="https://randompicbot-login.moyondumiso452.workers.dev/login"
  >
    Log in with TikTok
  </a>

  <button id="postButton">
    🎵 Confirm & Post to TikTok
  </button>

  <div id="status"></div>

  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>

</div>

<script>

const loginButton = document.getElementById("loginButton");
const postButton = document.getElementById("postButton");
const status = document.getElementById("status");

const params = new URLSearchParams(window.location.search);

if (params.get("tiktok") === "connected") {

  loginButton.style.display = "none";
  postButton.style.display = "inline-block";

  status.textContent =
    "✅ TikTok connected. Your picture is ready to post.";

}

postButton.addEventListener("click", async () => {

  status.textContent = "📤 Posting to TikTok...";
  postButton.disabled = true;

  try {

    const response = await fetch(
      "https://randompicbot-login.moyondumiso452.workers.dev/post-photo",
      {
        method: "POST",
        credentials: "include"
      }
    );

    const data = await response.json();

    console.log(data);

    if (!response.ok) {

      status.textContent =
        "❌ Posting failed. Check the TikTok connection.";

      console.error(data);
      postButton.disabled = false;
      return;

    }

    status.textContent =
      "🎉 Posted to TikTok successfully!";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Something went wrong.";

    postButton.disabled = false;

  }

});

</script>

</body>
</html>
