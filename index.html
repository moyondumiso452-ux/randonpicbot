<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RandomPicBot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 35px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    button,
    .login-button {
      border: 0;
      cursor: pointer;
      display: inline-block;
      margin: 10px;
      padding: 14px 25px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }

    .login-button {
      background: #000;
      color: white;
      text-decoration: none;
    }

    #findButton {
      background: #4f46e5;
      color: white;
    }

    #postButton {
      background: #ff0050;
      color: white;
      display: none;
    }

    #photo {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 25px;
      display: none;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      margin: 0 10px;
      color: #555;
    }

    .credit {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
    }

    .credit a {
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RandomPicBot</h1>

  <p>
    Find beautiful pictures and publish them to TikTok.
  </p>

  <a
    class="login-button"
    href="https://randompicbot-login.moyondumiso452.workers.dev/login"
  >
    Log in with TikTok
  </a>

  <br>

  <button id="findButton">
    🌅 Find Beautiful Sky
  </button>

  <img id="photo" alt="Beautiful sky">

  <div id="credit" class="credit"></div>

  <br>

  <button id="postButton">
    🎵 Post to TikTok
  </button>

  <div id="status"></div>

  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>

</div>

<script>

const WORKER_URL =
  "https://randompicbot-login.moyondumiso452.workers.dev";

const findButton =
  document.getElementById("findButton");

const postButton =
  document.getElementById("postButton");

const photo =
  document.getElementById("photo");

const status =
  document.getElementById("status");

const credit =
  document.getElementById("credit");

let currentImage = null;


// =========================
// FIND RANDOM PEXELS PHOTO
// =========================

findButton.addEventListener("click", async () => {

  status.textContent =
    "🔎 Finding a beautiful sky...";

  findButton.disabled = true;
  postButton.style.display = "none";
  photo.style.display = "none";
  credit.textContent = "";
  currentImage = null;

  try {

    const response = await fetch(
      `${WORKER_URL}/random-photo`
    );

    const data = await response.json();

    if (!response.ok) {
      console.error(data);

      status.textContent =
        "❌ Couldn't get a picture.";

      findButton.disabled = false;
      return;
    }

    currentImage = data.image_url;

    photo.src = currentImage;

    photo.onload = () => {

      photo.style.display = "block";

      postButton.style.display =
        "inline-block";

      status.textContent =
        "✅ Beautiful sky found!";

      if (data.photographer) {

        if (data.photographer_url) {

          credit.innerHTML =
            `Photo by <a href="${data.photographer_url}" target="_blank" rel="noopener">${data.photographer}</a> on Pexels`;

        } else {

          credit.textContent =
            `Photo by ${data.photographer} on Pexels`;
        }
      }

      findButton.disabled = false;
    };

    photo.onerror = () => {

      status.textContent =
        "❌ The picture couldn't be loaded.";

      findButton.disabled = false;
    };

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Couldn't connect to RandomPicBot.";

    findButton.disabled = false;
  }

});


// =========================
// POST TO TIKTOK
// =========================

postButton.addEventListener("click", async () => {

  if (!currentImage) {

    status.textContent =
      "Find a picture first.";

    return;
  }

  const confirmed = confirm(
    "Post this picture to your TikTok account?"
  );

  if (!confirmed) return;

  status.textContent =
    "📤 Sending picture to TikTok...";

  postButton.disabled = true;

  try {

    const response = await fetch(
      `${WORKER_URL}/post-photo`,
      {
        method: "POST",

        credentials: "include",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          image_url: currentImage
        })
      }
    );

    const data = await response.json();

    console.log(data);

    if (!response.ok) {

      status.textContent =
        "❌ TikTok rejected the post. Check the console.";

      console.error(data);

      postButton.disabled = false;

      return;
    }

    status.textContent =
      "🎉 Sent to TikTok successfully!";

    postButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Something went wrong.";

    postButton.disabled = false;
  }

});

</script>

</body>
</html>
