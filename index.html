<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RandomPicBot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    .tiktok-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    .tiktok-button:hover {
      background: #222;
    }

    .status {
      margin-top: 20px;
      color: #16803c;
      font-weight: bold;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      margin: 0 10px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>RandomPicBot</h1>

    <p>
      Find pictures and publish content to TikTok.
    </p>

    <a
      class="tiktok-button"
      href="https://randompicbot-login.moyondumiso452.workers.dev/login"
    >
      Log in with TikTok
    </a>

    <div id="status" class="status"></div>

    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("tiktok") === "connected") {
      document.getElementById("status").textContent =
        "✓ TikTok connected successfully!";
    }
  </script>

</body>
</html>
